<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback: 404.html stashes the requested URL in
      // sessionStorage before redirecting here; restore it before React
      // mounts so deep links land on the right route with a clean path.
      if (sessionStorage.redirect) {
        var target = sessionStorage.redirect;
        delete sessionStorage.redirect;
        history.replaceState(null, "", target);
      }
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cyber@Cornell — Cornell University's cybersecurity club. Weekly workshops, CTF competitions, vulnerability research, and security development. Applications open each fall."
    />
    <title>Cyber@Cornell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
